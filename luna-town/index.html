<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luna's Town</title>
<meta name="description" content="A little walkable town starring Luna the husky. Click the roads and she'll trot over." />
<link rel="icon" href="../favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="../favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --bg: #0f1115;
    --text: #f2f4f8;
    --text-muted: #9aa3b2;
    --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: var(--font);
    background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center;
  }
  .back-link {
    position: fixed; top: 20px; left: 20px;
    color: var(--text-muted); text-decoration: none; font-size: .875rem;
    z-index: 100; transition: color .2s;
  }
  .back-link:hover { color: var(--text); }
  .page { text-align: center; padding: 40px 20px; }
  .title { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; letter-spacing: -.01em; }
  .instructions { font-size: .875rem; color: var(--text-muted); margin-bottom: 24px; }

  #town-wrapper {
    display: inline-block; border-radius: 8px; overflow: hidden;
    box-shadow: 0 4px 24px #0000004d;
  }
  #town-container {
    position: relative; display: inline-block;
    background: url(luna-town-square.png) no-repeat center center;
    background-size: 100% 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #town-grid { display: grid; gap: 0; position: relative; z-index: 1; }

  .tile { width: 40px; height: 40px; position: relative; background: transparent; }
  .tile-grass, .tile-building, .tile-tree, .tile-park, .tile-water, .tile-flower { background: transparent; }
  .tile-road { background: transparent; transition: background .15s; }
  .tile-road:hover { background: #ffffff26; }
  .building-overlay { display: none; }

  .luna-bubble {
    position: absolute; background: #fff; color: #333; font-size: 12px;
    font-family: var(--font); padding: 6px 10px; border-radius: 8px;
    transform: translate(-50%, -100%); white-space: nowrap; z-index: 20;
    box-shadow: 0 2px 8px #0003; pointer-events: none;
  }
  .luna-bubble:after {
    content: ""; position: absolute; bottom: -6px; left: 50%;
    transform: translate(-50%); width: 0; height: 0;
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-top: 6px solid #fff;
  }
  .enter-modal { display: none; }

  @media (max-width: 900px) { #town-wrapper { transform: scale(.85); transform-origin: top center; } }
  @media (max-width: 720px) { #town-wrapper { transform: scale(.65); transform-origin: top center; } }
  @media (max-width: 560px) { #town-wrapper { transform: scale(.5);  transform-origin: top center; } }
</style>
</head>
<body>
  <a href="../" class="back-link">&larr; Back to portfolio</a>
  <div class="page">
    <h1 class="title">Luna's Town</h1>
    <p class="instructions">Click the roads and Luna the husky will trot over. Walk up to a building and she'll say hello.</p>
    <div id="town-wrapper">
      <div id="town-container">
        <div id="town-grid"></div>
      </div>
    </div>
  </div>
  <script src="town.js"></script>
</body>
</html>
